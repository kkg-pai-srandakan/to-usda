<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Utama - Tryout USDA PAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJkZWZhdWx0X2xvY2FsZSI6ICJpZCIsCiAgIm5hbWUiOiAiVHJ5b3V0IFVTREEgUEFJIiwKICAic2hvcnRfbmFtZSI6ICJVU0RBIFBBSSIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjZmZmZmZmIiwKICAidGhlbWVfY29sb3IiOiAiIzEwYjk4MSIKfQ==">
    <style>
        :root { --emerald: #10b981; --emerald-dark: #064e3b; --text-main: #1e293b; }
        body {
            margin: 0; min-height: 100vh; font-family: 'Plus Jakarta Sans', sans-serif;
            background: #ffffff; color: var(--text-main);
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
        }
        .container { width: 90%; max-width: 1000px; padding: 40px 20px; text-align: center; }
        .branding h1 { font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 800; color: var(--emerald-dark); margin: 0; text-transform: uppercase; }
        .branding p { font-size: clamp(0.9rem, 2vw, 1.2rem); color: var(--emerald); font-weight: 700; margin: 10px 0 40px; letter-spacing: 1px; }
        .choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .choice-card {
            background: #f0fdf4; border: 2px solid transparent; border-radius: 24px;
            padding: 40px 20px; text-decoration: none; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center;
        }
        .choice-card:hover { transform: translateY(-10px); background: #fff; border-color: var(--emerald); box-shadow: 0 20px 40px rgba(16, 185, 129, 0.1); }
        .icon { font-size: 4rem; margin-bottom: 15px; }
        .choice-card h2 { font-size: 1.5rem; font-weight: 800; color: var(--emerald-dark); margin: 0; }
        .choice-card p { color: #64748b; font-weight: 600; margin-top: 5px; }
        .footer { margin-top: 50px; font-size: 0.85rem; font-weight: 600; color: #94a3b8; }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="container">
        <header class="branding">
            <h1>GERBANG PORTAL</h1>
            <p>USDA PAI • KAPANEVON SRANDAKAN</p>
        </header>
        <div class="choice-grid">
            <a href="ujian.html" class="choice-card">
                <div class="icon">✏️</div>
                <h2>PORTAL SISWA</h2>
                <p>Masuk Halaman Ujian</p>
            </a>
            <a href="proktor.html" class="choice-card">
                <div class="icon">🛡️</div>
                <h2>PORTAL PROKTOR</h2>
                <p>Masuk Halaman Proktor</p>
            </a>
        </div>
        <footer class="footer">&copy; 2026 KKG PAI Kapanewon Srandakan</footer>
    </div>
    <script>
        document.onkeydown = (e) => {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 67 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) return false;
        };
    </script>
</body>
</html>
