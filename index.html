<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerbang Portal - Tryout USDA PAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palet Warna Cerah & Segar (Hijau-Putih) */
            --bg-body: #ffffff;
            --bg-light: #f0fdf4; /* Hijau mint sangat muda */
            --emerald: #10b981;
            --emerald-dark: #064e3b;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        html, body {
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        .branding h1 {
            font-size: 3rem;
            font-weight: 800;
            margin: 0;
            color: var(--emerald-dark);
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .branding p {
            margin: 10px 0 50px;
            color: var(--emerald);
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .choice-card {
            background: var(--bg-light);
            border: 2px solid transparent;
            border-radius: 32px;
            padding: 60px 30px;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.05);
        }

        .choice-card:hover {
            transform: translateY(-15px);
            background: #ffffff;
            border-color: var(--emerald);
            box-shadow: 0 25px 50px rgba(16, 185, 129, 0.15);
        }

        .icon {
            font-size: 5rem;
            margin-bottom: 25px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
        }

        .choice-card h2 {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
            color: var(--emerald-dark);
        }

        .choice-card p {
            margin: 12px 0 0;
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .footer {
            margin-top: 60px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Responsif Mobile */
        @media (max-width: 700px) {
            .choice-grid { grid-template-columns: 1fr; gap: 20px; }
            .branding h1 { font-size: 2.2rem; }
            .choice-card { padding: 40px 20px; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <header class="branding">
        <h1>GERBANG PORTAL</h1>
        <p>USDA PAI • KAPANEVON SRANDAKAN</p>
    </header>

    <div class="choice-grid">
        <a href="ujian.html" class="choice-card card-siswa">
            <div class="icon">✏️</div>
            <h2>PORTAL SISWA</h2>
            <p>Masuk Halaman Ujian</p>
        </a>

        <a href="proktor.html" class="choice-card card-proktor">
            <div class="icon">🛡️</div>
            <h2>PORTAL PROKTOR</h2>
            <p>Masuk Halaman Proktor</p>
        </a>
    </div>

    <footer class="footer">
        &copy; 2026 Ardika Riski Rahmawan, S.Pd. • SDN 1 Godegan
    </footer>
</div>

<script>
    // Keamanan: Disable F12 & Inspect
    document.onkeydown = function(e) {
        if(e.keyCode == 123) return false;
        if(e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) return false;
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        if(e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) return false;
    };
</script>

</body>
</html>
