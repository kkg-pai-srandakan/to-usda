<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerbang Portal - Tryout USDA PAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --emerald: #10b981;
            --sky: #0ea5e9;
            --text-light: #f1f5f9;
        }

        html, body {
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, #1e293b, var(--bg-dark));
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        .branding h1 {
            font-size: 3rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .branding p {
            margin: 10px 0 40px;
            opacity: 0.7;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .choice-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 20px;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Tema Siswa */
        .card-siswa:hover {
            background: rgba(14, 165, 233, 0.1);
            border-color: var(--sky);
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(14, 165, 233, 0.2);
        }

        /* Tema Proktor */
        .card-proktor:hover {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--emerald);
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.2);
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .choice-card h2 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
        }

        .choice-card p {
            margin: 10px 0 0;
            opacity: 0.6;
            font-size: 1rem;
        }

        .footer {
            margin-top: 50px;
            opacity: 0.4;
            font-size: 0.85rem;
        }

        /* Responsif Mobile */
        @media (max-width: 600px) {
            .choice-grid { grid-template-columns: 1fr; }
            .branding h1 { font-size: 2rem; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <header class="branding">
        <h1>PORTAL TRYOUT</h1>
        <p>USDA PAI • KAPANEVON SRANDAKAN</p>
    </header>

    <div class="choice-grid">
        <a href="siswa.html" class="choice-card card-siswa">
            <div class="icon">✏️</div>
            <h2>PORTAL SISWA</h2>
            <p>Klik untuk mulai mengerjakan ujian</p>
        </a>

        <a href="proktor.html" class="choice-card card-proktor">
            <div class="icon">🛡️</div>
            <h2>PORTAL PROKTOR</h2>
            <p>Klik untuk masuk ke panel proktor</p>
        </a>
    </div>

    <footer class="footer">
        &copy; 2026 Ardika Riski Rahmawan, S.Pd. • SDN 1 Godegan
    </footer>
</div>

<script>
    // Keamanan: Disable F12 & Inspect
    document.onkeydown = function(e) {
        if(e.keyCode == 123) return false;
        if(e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) return false;
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
    };
</script>

</body>
</html>
